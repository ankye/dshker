name: Package desktop installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go for the core
        uses: actions/setup-go@v5
        with:
          go-version-file: networking/go.mod
          cache-dependency-path: networking/go.sum

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          expected_tag="v${package_version}"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release version::package.json version must be a stable semantic version, received '${package_version}'."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error title=Tag and package version differ::Expected '${expected_tag}' from package.json, received '${GITHUB_REF_NAME}'."
            exit 1
          fi

      - name: Resolve Git executable
        shell: pwsh
        run: |
          $git = (Get-Command git).Source
          "DSH_BUNDLED_GIT_EXECUTABLE=$git" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run release-input checks
        run: |
          npm run seed:prepare:ci
          npm run seed:verify
          npm run environment:check
          npm run architecture:check
          npm run format:check
          npm run type-check
          npm test -- --run
          npm run test:e2e
          npm run test:dshkerd-distribution
          npm run service:smoke
          npm run visual:smoke
          npm run performance:check -- --mode release-readiness --json

      # The core is Go, and this job is the only place the suite runs on Linux:
      # the packaging jobs build and run it, but they do not test it. The
      # fixture-backed integration package is excluded because it needs a built
      # coordination server, which is a separate, explicit run.
      - name: Run core unit tests
        working-directory: networking
        run: |
          go vet ./...
          go test ./internal/... ./cmd/...

      # The Linux credential provider talks to the Secret Service, so proving it
      # round-trips needs a session bus and an unlocked keyring. Without them the
      # provider reports itself unavailable, which the suite already covers; with
      # them the round-trip runs instead of skipping. This step is best-effort on
      # purpose: the tests decide, not the setup.
      - name: Round-trip a credential through the Linux keyring
        working-directory: networking
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus-x11
          dbus-run-session -- bash -lc '
            set -u
            eval "$(printf %s "unlock" | gnome-keyring-daemon --unlock --daemonize 2>/dev/null || true)"
            export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
            go test ./internal/secret/ -run SecretService -v
          '

  package:
    name: ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            script: dist:mac-arm64
            coreTarget: darwin-arm64
            artifact: dshker-launcher-macos-arm64
            launchTimeoutMs: 60000
            pattern: |
              release/*.dmg
              release/release-manifest.json
              release/checksums.txt
          - name: macOS x64
            os: macos-15-intel
            script: dist:mac-x64
            coreTarget: darwin-x64
            artifact: dshker-launcher-macos-x64
            launchTimeoutMs: 60000
            pattern: |
              release/*.dmg
              release/release-manifest.json
              release/checksums.txt
          - name: Windows x64
            os: windows-latest
            script: dist:win-x64
            coreTarget: win32-x64
            artifact: dshker-launcher-windows-x64
            launchTimeoutMs: 60000
            pattern: |
              release/*.exe
              release/release-manifest.json
              release/checksums.txt
          - name: Windows arm64
            os: windows-11-arm
            script: dist:win-arm64
            coreTarget: win32-arm64
            artifact: dshker-launcher-windows-arm64
            launchTimeoutMs: 60000
            pattern: |
              release/*.exe
              release/release-manifest.json
              release/checksums.txt
          - name: Linux x64
            os: ubuntu-latest
            script: dist:linux-x64
            coreTarget: linux-x64
            artifact: dshker-launcher-linux-x64
            launchTimeoutMs: 60000
            smokePrefix: xvfb-run -a
            pattern: |
              release/*.AppImage
              release/*.deb
              release/release-manifest.json
              release/checksums.txt
          - name: Linux arm64
            os: ubuntu-latest
            script: dist:linux-arm64
            coreTarget: linux-arm64
            artifact: dshker-launcher-linux-arm64
            launchTimeoutMs: 60000
            smokePrefix: xvfb-run -a
            smokeSkip: true
            pattern: |
              release/*.AppImage
              release/*.deb
              release/release-manifest.json
              release/checksums.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go for the peer helper
        uses: actions/setup-go@v5
        with:
          go-version-file: networking/go.mod
          cache-dependency-path: networking/go.sum

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve Git executable
        shell: pwsh
        run: |
          $git = (Get-Command git).Source
          "DSH_BUNDLED_GIT_EXECUTABLE=$git" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare and verify pinned release-input seed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $logPath = Join-Path $PWD 'release/ci-build.log'
          npm run seed:prepare:ci *>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $tail = (Get-Content -LiteralPath $logPath -Tail 80) -join "`n"
            $escapedTail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Bundled seed preparation::$escapedTail"
            exit $exitCode
          }
          npm run seed:verify *>&1 | Tee-Object -FilePath $logPath -Append
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $tail = (Get-Content -LiteralPath $logPath -Tail 80) -join "`n"
            $escapedTail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Bundled seed verification::$escapedTail"
            exit $exitCode
          }

      - name: Build unsigned installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $logPath = Join-Path $PWD 'release/ci-build.log'
          npm run ${{ matrix.script }} *>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $tail = (Get-Content -LiteralPath $logPath -Tail 80) -join "`n"
            $escapedTail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer build output::$escapedTail"
            exit $exitCode
          }

      - name: Verify generated metadata
        run: npm run release:verify

      # The core the installer carries must also answer as a headless host on the
      # machine that built it: the binary matches its manifest, serve publishes
      # its own endpoint, a named command answers over it, and a refusal keeps
      # its typed code. A cross-built Linux arm64 core is skipped like the
      # packaged smoke, because it cannot execute on the x64 runner.
      - name: Verify the packaged core answers headlessly
        if: ${{ !matrix.smokeSkip }}
        shell: pwsh
        run: node tools/headless-core-smoke.mjs --target ${{ matrix.coreTarget }} --json

      - name: Run packaged application smoke
        if: ${{ !matrix.smokeSkip }}
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: ${{ matrix.smokePrefix }} npm run release:smoke -- --launch-timeout-ms ${{ matrix.launchTimeoutMs }}

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-diagnostics
          path: |
            release/ci-build.log
            release/release-smoke.log
            release/release-smoke-launch.trace
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 14

  dshkerd-cli:
    name: dshkerd CLI ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            target: darwin-arm64
            script: build:dshkerd:mac-arm64
            artifact: dshkerd-cli-darwin-arm64
          - name: macOS x64
            target: darwin-x64
            script: build:dshkerd:mac-x64
            artifact: dshkerd-cli-darwin-x64
          - name: Windows arm64
            target: windows-arm64
            script: build:dshkerd:win-arm64
            artifact: dshkerd-cli-windows-arm64
          - name: Windows x64
            target: windows-x64
            script: build:dshkerd:win-x64
            artifact: dshkerd-cli-windows-x64
          - name: Linux arm64
            target: linux-arm64
            script: build:dshkerd:linux-arm64
            artifact: dshkerd-cli-linux-arm64
          - name: Linux x64
            target: linux-x64
            script: build:dshkerd:linux-x64
            artifact: dshkerd-cli-linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go for dshkerd
        uses: actions/setup-go@v5
        with:
          go-version-file: networking/go.mod
          cache-dependency-path: networking/go.sum

      - name: Build and verify standalone archive
        shell: bash
        run: |
          npm run "${{ matrix.script }}"
          node -e "const fs=require('node:fs'); const p='release/dshkerd'; const t='${{ matrix.target }}'; const v=require('./package.json').version; const e=t.startsWith('windows')?'zip':'tar.gz'; for (const f of ['dshkerd-'+v+'-'+t+'.'+e,'dshkerd-'+v+'-checksums.txt','dshkerd-'+v+'-manifest.json']) if (!fs.existsSync(p+'/'+f)) throw new Error('Missing '+p+'/'+f)"

      - name: Upload standalone CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/dshkerd/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [package, dshkerd-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download exact macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: dshker-launcher-macos-arm64
          path: release-input/macos-arm64

      - name: Download exact macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: dshker-launcher-macos-x64
          path: release-input/macos-x64

      - name: Download exact Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dshker-launcher-windows-x64
          path: release-input/windows-x64

      - name: Download exact Windows arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dshker-launcher-windows-arm64
          path: release-input/windows-arm64

      - name: Download exact Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dshker-launcher-linux-x64
          path: release-input/linux-x64

      - name: Download exact Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dshker-launcher-linux-arm64
          path: release-input/linux-arm64

      - name: Download standalone dshkerd macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dshkerd-cli-darwin-arm64
          path: release-input/dshkerd-darwin-arm64

      - name: Download standalone dshkerd macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dshkerd-cli-darwin-x64
          path: release-input/dshkerd-darwin-x64

      - name: Download standalone dshkerd Windows arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dshkerd-cli-windows-arm64
          path: release-input/dshkerd-windows-arm64

      - name: Download standalone dshkerd Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dshkerd-cli-windows-x64
          path: release-input/dshkerd-windows-x64

      - name: Download standalone dshkerd Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dshkerd-cli-linux-arm64
          path: release-input/dshkerd-linux-arm64

      - name: Download standalone dshkerd Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dshkerd-cli-linux-x64
          path: release-input/dshkerd-linux-x64

      - name: Validate and assemble release assets
        shell: bash
        run: |
          node tools/assemble-release-assets.mjs
          node tools/assemble-dshkerd-assets.mjs

      - name: Refuse an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status="$(curl --silent --show-error --output release-existing.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          case "$status" in
            200)
              echo "::error title=GitHub Release already exists::Refusing to overwrite release '${GITHUB_REF_NAME}'."
              exit 1
              ;;
            404)
              ;;
            *)
              echo "::error title=GitHub Release lookup failed::GitHub returned HTTP ${status}; release publication was not attempted."
              exit 1
              ;;
          esac

      - name: Create public stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          release_notes="$(awk -v version="$release_version" '
            $0 ~ "^##[[:space:]]+" version "([[:space:]]|$)" { inside=1; next }
            inside && /^##[[:space:]]/ { exit }
            inside { print }
          ' CHANGELOG.md)"
          if [[ -z "${release_notes//[[:space:]]/}" ]]; then
            echo "::error title=Missing release notes::CHANGELOG.md has no entry for ${GITHUB_REF_NAME}."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            publish/*.dmg \
            publish/*.exe \
            publish/*.AppImage \
            publish/*.deb \
            publish/checksums.txt \
            publish/release-manifest-macos-arm64.json \
            publish/release-manifest-macos-x64.json \
            publish/release-manifest-windows-x64.json \
            publish/release-manifest-windows-arm64.json \
            publish/release-manifest-linux-x64.json \
            publish/release-manifest-linux-arm64.json \
            publish/dshkerd-*.tar.gz \
            publish/dshkerd-*.zip \
            publish/dshkerd-*-checksums.txt \
            publish/dshkerd-*-manifest.json \
            publish/install-dshkerd.sh \
            publish/install-dshkerd.ps1 \
            --verify-tag \
            --notes "$release_notes" \
            --title "DSHKer Launcher ${GITHUB_REF_NAME}"

      - name: Refuse a release that carries no installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A release whose upload silently produced nothing is worse than a failed
          # build: the tag looks published, the version is announced, and the only
          # way anyone finds out is by trying to install it. `gh release create` has
          # exited 0 with zero assets attached, so success is asserted here against
          # what the release actually holds.
          attached="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')"
          echo "attached assets: ${attached}"
          missing=0
          for required in \
            "dshker-launcher-*-mac-arm64.dmg" \
            "dshker-launcher-*-mac-x64.dmg" \
            "dshker-launcher-*-win-x64.exe" \
            "dshker-launcher-*-win-arm64.exe" \
            "checksums.txt"; do
            if ! gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -q -- "${required//\*/.*}"; then
              echo "::error title=Missing release asset::${GITHUB_REF_NAME} has no asset matching ${required}."
              missing=1
            fi
          done
          if [[ "$attached" -eq 0 || "$missing" -ne 0 ]]; then
            echo "::error title=Empty or incomplete release::Refusing to leave ${GITHUB_REF_NAME} published without its installers."
            exit 1
          fi
